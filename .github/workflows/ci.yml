name: CI

on:
  push:
    branches: [r0, main]
  pull_request:
  workflow_call:

# Read-only, no deploy step, no secrets used anywhere in this workflow: it only checks out the repo,
# installs dependencies from the committed lockfile, and runs the same typecheck/lint/test/build
# commands documented in the root README/package.json. Deploying the contracts needs a private key
# and is run by hand — see packages/contracts/DEPLOY.md — never from CI.
# The site itself deploys live from deploy.yml, which runs this workflow first (workflow_call).
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      # No token in .git/config: the tests load the Firebase CLI's code, and nothing here pushes or fetches.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node version comes from .nvmrc ("22": the newest 22.x), which satisfies the root package.json's
      # "engines": { "node": "^22.16.0" } and is what contributors run locally. 22.16 fixed an
      # AbortSignal.timeout inside AbortSignal.any that could be garbage-collected and never fire
      # (nodejs/node#57736), which the server's explorer requests rely on.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm workspaces monorepo — one install at the root links every package. This also fetches
      # Foundry (npm-installed: @foundry-rs/forge, @foundry-rs/cast, @foundry-rs/anvil) and
      # forge-std (an npm devDependency fetched from GitHub by tag, "forge-std":
      # "github:foundry-rs/forge-std#v1.16.2" in packages/contracts/package.json) exactly the way a
      # local `npm install` does — no separate curl-install-foundry step.
      # npm 10 (bundled with Node 22) leaves out the forge/cast/anvil command links: each
      # @foundry-rs/<tool> wrapper and each of its per-platform packages declare the same bin name,
      # and when npm 10 skips the packages built for other platforms it also deletes that shared
      # node_modules/.bin link. The contracts scripts no longer use that link (they run
      # scripts/forge.mjs), but the hand-run `npx forge` / `npx cast` commands in DEPLOY.md do, so the
      # README requires npm 11 and CI installs the version that was verified to keep the link
      # (11.6.2 and 11.19.1 both do).
      - run: npm install -g npm@11.19.1

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Lint
        run: npm run lint

      # The Firebase CLI at the version tools/firebase pins, from its own lockfile (it is not a
      # workspace, so the install above leaves it out). @arcos/data's unit tests load its deploy code
      # to check firebase.json and the indexes file. No install scripts: nothing in its tree needs one.
      - run: npm ci --ignore-scripts --prefix tools/firebase

      # The JS/TS workspaces' own vitest suites. @arcos/contracts' "test" script is `forge test`,
      # run as its own step below instead, so a Solidity failure and a TS failure are never
      # conflated in the same step's output. @arcos/data's emulator suite runs in emulator.yml.
      - name: Test (JS workspaces)
        run: npm run test --workspace=@arcos/web --workspace=@arcos/chain --workspace=@arcos/shell --workspace=@arcos/inspector --workspace=@arcos/data

      # The contracts scripts run forge through packages/contracts/scripts/forge.mjs: the npm `forge`
      # command (@foundry-rs/forge 1.7.1) exits 0 even when a test fails, which kept this step green.
      - name: Test (contracts — forge)
        run: npm run test -w @arcos/contracts

      - name: Build (web)
        run: npm run build -w @arcos/web

      # Fails if the committed ABIs (packages/chain/src/abis) don't match what the current Solidity
      # sources actually export — catching a contract change whose regenerated ABI never got
      # committed alongside it.
      - name: ABI drift check
        run: |
          npm run abis -w @arcos/contracts
          git diff --exit-code packages/chain/src/abis

      - name: npm audit (high/critical)
        run: npm audit --audit-level=high

      # The pinned Firebase CLI is not a root workspace, so the root audit doesn't see it.
      - name: npm audit of the Firebase CLI (high/critical)
        run: npm audit --audit-level=high --prefix tools/firebase

  # The end-to-end smoke suite (e2e/smoke.spec.ts) in a real browser against a production build, beside the checks
  # above rather than after them. Built with the settings in apps/web/apphosting.yaml, like https://4rcos.com. The /t and /badge cases read the chain
  # at request time; they hold when that read fails too, since the app then answers its degraded page and a neutral
  # badge. No explorer key here: the explorer-backed checks read "unknown", which the suite doesn't depend on.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The same npm as the ci job, for the same reason (see there).
      - run: npm install -g npm@11.19.1

      - run: npm ci

      # e2e/ is not a workspace, so the ci job's typecheck doesn't reach it, and Playwright only strips types.
      - name: Typecheck (e2e)
        run: npm run typecheck:e2e

      # The browser build this @playwright/test version expects, with its system libraries. CI only: locally, run
      # it once yourself, or point E2E_CHROMIUM_PATH at a Chromium you have (see playwright.config.ts).
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # The same settings as the deploy's bundle (deploy.yml): only NEXT_PUBLIC_ values, read from the file App
      # Hosting reads, so this build can't drift from the site's.
      - name: Read the build settings from apps/web/apphosting.yaml
        run: node scripts/apphosting-env.mjs | tee -a "$GITHUB_ENV"

      - name: Build (web)
        run: npm run build -w @arcos/web

      # Playwright starts `next start` on the build above (webServer in playwright.config.ts) and stops it afterwards.
      - name: End-to-end smoke tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
