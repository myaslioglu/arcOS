name: Deploy

# Deploys https://4rcos.com (backend arcos) and https://testnet.4rcos.com (backend arcos-testnet) to Firebase App
# Hosting, and the functions codebase arcos (arcosIndexer) with the Firestore indexes of the arcos database, project
# arcos-c80cf, from GitHub Actions. No key file exists anywhere: the deploy job signs in through
# Workload Identity Federation and a service account (see docs/DEPLOYING.md), and it runs only after the checks and the
# bundle builds pass and the owner approves it in the `production` environment, which allows the main branch only.
#
# Both sites come from the same commit under one approval. A push to main deploys both; a manual run can pick one
# (`targets`). The testnet site takes part only once the repository variable ARCOS_TESTNET_READY is `true`, which the
# owner sets after its backend exists (docs/DEPLOYING.md, The testnet site). Until then a push builds and deploys 4rc.OS
# alone, and a manual run that asks for the testnet site fails before any bundle is built. The mainnet site goes first,
# and the testnet deploy starts only after it has succeeded, so a testnet failure never touches 4rc.OS. A bundle that
# fails to build stops the whole run before approval, nothing deployed; to ship 4rc.OS while the testnet build is broken,
# run the workflow by hand with `targets: mainnet`.
#
# The functions and the indexes (docs/OPERATIONS.md) take part only once the repository variable ARCOS_FUNCTIONS_READY is
# `true`, which the owner sets after the database, the account arcos-jobs@ and the deployer's roles exist. From then on a
# push deploys them after the sites, from the same commit; a manual run can deploy either alone (`targets: functions` or
# `targets: indexes`). The functions are built in a job without a credential, like the sites: the bundle and the manifest
# firebase-functions writes from it (functions/deploy/functions.yaml), which the CLI reads instead of loading the code.
#
# The jobs are split by what they may touch. `plan` reads only the inputs and that variable, checks nothing out and
# holds no token. `checks` and `bundle` install the project's dependencies and run its build, which is third-party code,
# so they hold no credential. `deploy` holds the credential and runs no project code: only first-party actions and the
# SHA-pinned auth action, the bundle as data, the scan script from its own checkout and the Firebase CLI installed from
# its lockfile. It restores no cache.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Sign in to Google Cloud and list the App Hosting backends, but deploy nothing
        type: boolean
        default: false
      targets:
        description: What to build and deploy (a push to main deploys both sites, mainnet first, then the indexes and the functions; testnet needs ARCOS_TESTNET_READY, functions and indexes ARCOS_FUNCTIONS_READY)
        type: choice
        options:
          - both
          - mainnet
          - testnet
          - functions
          - indexes
        default: both

# One deploy at a time. A run that starts while another waits for approval or deploys queues behind it (a newer
# waiting run replaces an older waiting one), and a deploy that has started is never cancelled halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

# bash with pipefail, so a failing script at the head of a pipe fails its step.
defaults:
  run:
    shell: bash

env:
  FIREBASE_PROJECT: arcos-c80cf
  APPHOSTING_BACKEND: arcos
  APPHOSTING_TESTNET_BACKEND: arcos-testnet

jobs:
  # Chooses what this run builds and deploys, from the `targets` input and the repository variables ARCOS_TESTNET_READY
  # and ARCOS_FUNCTIONS_READY, before anything is built. A push has no inputs (TARGETS is empty): both sites once the
  # testnet variable is exactly `true`, 4rc.OS alone with a notice until then; and the indexes and the functions once the
  # functions variable is exactly `true`, with a notice until then. A manual run that asks for something whose variable
  # isn't `true` fails here, so it never deploys less than it asked for. No checkout, no token, no project code.
  plan:
    name: Choose the sites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      sites: ${{ steps.plan.outputs.sites }}
      mainnet: ${{ steps.plan.outputs.mainnet }}
      testnet: ${{ steps.plan.outputs.testnet }}
      functions: ${{ steps.plan.outputs.functions }}
      indexes: ${{ steps.plan.outputs.indexes }}
    steps:
      - name: Choose the sites, the functions and the indexes
        id: plan
        env:
          TARGETS: ${{ inputs.targets }}
          TESTNET_READY: ${{ vars.ARCOS_TESTNET_READY }}
          FUNCTIONS_READY: ${{ vars.ARCOS_FUNCTIONS_READY }}
        run: |
          functions=false; indexes=false
          case "$TARGETS" in
            "") mainnet=true; testnet=true; functions=true; indexes=true ;;
            both) mainnet=true; testnet=true ;;
            mainnet) mainnet=true; testnet=false ;;
            testnet) mainnet=false; testnet=true ;;
            functions) mainnet=false; testnet=false; functions=true ;;
            indexes) mainnet=false; testnet=false; indexes=true ;;
            *) echo "::error::Unknown targets '$TARGETS'"; exit 1 ;;
          esac
          if [ "$testnet" = true ] && [ "$TESTNET_READY" != true ]; then
            if [ -n "$TARGETS" ]; then
              echo "::error::The testnet site isn't set up yet: the repository variable ARCOS_TESTNET_READY is not true (docs/DEPLOYING.md, The testnet site). To deploy 4rc.OS, run again with targets: mainnet."
              exit 1
            fi
            echo "::notice::ARCOS_TESTNET_READY is not true, so this run builds and deploys 4rc.OS only (docs/DEPLOYING.md, The testnet site)."
            testnet=false
          fi
          if { [ "$functions" = true ] || [ "$indexes" = true ]; } && [ "$FUNCTIONS_READY" != true ]; then
            if [ -n "$TARGETS" ]; then
              echo "::error::The functions and the indexes aren't set up yet: the repository variable ARCOS_FUNCTIONS_READY is not true (docs/OPERATIONS.md, Setting it up)."
              exit 1
            fi
            echo "::notice::ARCOS_FUNCTIONS_READY is not true, so this run deploys neither the functions nor the indexes (docs/OPERATIONS.md, Setting it up)."
            functions=false; indexes=false
          fi
          if [ "$mainnet" = true ] && [ "$testnet" = true ]; then sites='["mainnet","testnet"]'
          elif [ "$mainnet" = true ]; then sites='["mainnet"]'
          elif [ "$testnet" = true ]; then sites='["testnet"]'
          else sites='[]'; fi
          { echo "sites=$sites"; echo "mainnet=$mainnet"; echo "testnet=$testnet"; echo "functions=$functions"; echo "indexes=$indexes"; } >> "$GITHUB_OUTPUT"

  # The same checks a pull request runs (ci.yml, called as a reusable workflow): typecheck, lint, tests, build, audit.
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Builds the bundle of each site this run deploys, which the deploy job scans: one leg per site, as `plan` chose. It
  # installs the project's dependencies and runs the Next.js build, so it gets no credential of any kind: a read-only
  # token, no environment, no secret, no variable. It runs beside `checks`, and `deploy` waits for both. fail-fast is
  # off so one site's failure doesn't cancel the other's build, whose log is then there to read.
  bundle:
    name: Build the ${{ matrix.site }} bundle
    runs-on: ubuntu-24.04
    needs: plan
    # A run of the functions or the indexes alone builds no site, and a matrix can't be empty.
    if: needs.plan.outputs.sites != '[]'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.plan.outputs.sites) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The same npm as ci.yml, for the same install.
      - run: npm install -g npm@11.19.1

      - run: npm ci

      # The build settings come from the files App Hosting reads, so this bundle and the site's can't drift apart:
      # apps/web/apphosting.yaml for mainnet, with apphosting.testnet.yaml merged over it for testnet, as App Hosting
      # merges it for the backend whose environment name is testnet. An empty name reads the base file alone. Only
      # NEXT_PUBLIC_ values pass; the script refuses anything else and never passes a secret.
      - name: Read the build settings from the App Hosting files
        env:
          APPHOSTING_ENVIRONMENT: ${{ matrix.site == 'testnet' && 'testnet' || '' }}
        run: node scripts/apphosting-env.mjs --environment "$APPHOSTING_ENVIRONMENT" | tee -a "$GITHUB_ENV"

      # A bundle for the wrong network would ship the wrong site under this one's name.
      - name: The settings must be this site's network
        env:
          SITE: ${{ matrix.site }}
        run: test "$NEXT_PUBLIC_ARC_NETWORK" = "$SITE"

      - name: Build the bundle
        run: npm run build -w @arcos/web

      # Build output only: the two paths share apps/web/.next, so the artifact holds static/ and server/. Hidden files
      # are kept so the scan sees every file the build made. One day is plenty (the deploy job takes it within this
      # run), and overwrite lets a re-run of this job replace the artifact of the first attempt.
      - name: Keep the bundle for the deploy job
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.site }}
          path: |
            apps/web/.next/static
            apps/web/.next/server
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # Builds the functions codebase arcos, when this run deploys it, with no credential of any kind, like the sites'
  # bundles: functions/deploy/index.js (esbuild) and functions/deploy/functions.yaml, the manifest the functions SDK writes
  # from that bundle. The deploy job hands both to the CLI as data: with the manifest there, the deploy doesn't load the
  # code to find the functions.
  functions-bundle:
    name: Build the functions bundle
    runs-on: ubuntu-24.04
    needs: plan
    if: needs.plan.outputs.functions == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The same npm as ci.yml, for the same install.
      - run: npm install -g npm@11.19.1

      - run: npm ci

      - name: Build the functions bundle and its manifest
        run: npm run build -w @arcos/functions

      # The two built files only: package.json, its lockfile and .npmrc come from the deploy job's own checkout.
      - name: Keep the functions bundle for the deploy job
        uses: actions/upload-artifact@v7
        with:
          name: bundle-functions
          path: |
            functions/deploy/index.js
            functions/deploy/functions.yaml
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # The only job with a credential. It runs nothing from the project's dependencies and nothing of the project's build:
  # the bundle arrives as data, and the scan script comes from this job's own checkout, never from the bundle.
  deploy:
    name: Deploy to production
    needs: [plan, checks, bundle, functions-bundle]
    # Belt and braces with the environment's branch rule: a manual run from another branch deploys nothing. A bundle job
    # this run didn't need is skipped, which must not skip the deploy; one that failed or was cancelled stops it.
    if: >-
      ${{ github.ref == 'refs/heads/main' && !cancelled() && needs.plan.result == 'success' && needs.checks.result == 'success'
      && (needs.bundle.result == 'success' || needs.bundle.result == 'skipped')
      && (needs.functions-bundle.result == 'success' || needs.functions-bundle.result == 'skipped') }}
    runs-on: ubuntu-24.04
    # Each deploy step stays under the hour an access token lives: the Firebase CLI asks for one when it starts and
    # never renews it. The job has room for both.
    timeout-minutes: 90
    environment:
      name: production
      url: https://4rcos.com
    permissions:
      contents: read
      id-token: write
    # Which sites this run deploys: the ones `plan` chose and `bundle` built.
    env:
      DEPLOY_MAINNET: ${{ needs.plan.outputs.mainnet }}
      DEPLOY_TESTNET: ${{ needs.plan.outputs.testnet }}
      DEPLOY_FUNCTIONS: ${{ needs.plan.outputs.functions }}
      DEPLOY_INDEXES: ${{ needs.plan.outputs.indexes }}
    # Whether the mainnet deploy succeeded, for the smoke job: it checks 4rc.OS even when the testnet deploy after it failed.
    outputs:
      mainnet: ${{ steps.deploy-mainnet.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No cache: root package.json names a packageManager, which makes setup-node restore an npm cache by default, and
      # any job on main that runs install scripts could have written that cache. Restoring it here would put files an
      # earlier job controlled next to the credential.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Outside the workspace on purpose: the Firebase CLI uploads the workspace as the source, and a bundle is not
      # source. By name, so a bundle this run deploys and the build didn't make fails here.
      - name: Download the mainnet bundle
        if: env.DEPLOY_MAINNET == 'true'
        uses: actions/download-artifact@v8
        with:
          name: bundle-mainnet
          path: ${{ runner.temp }}/bundle-mainnet

      - name: Download the testnet bundle
        if: env.DEPLOY_TESTNET == 'true'
        uses: actions/download-artifact@v8
        with:
          name: bundle-testnet
          path: ${{ runner.temp }}/bundle-testnet

      - name: Download the functions bundle
        if: env.DEPLOY_FUNCTIONS == 'true'
        uses: actions/download-artifact@v8
        with:
          name: bundle-functions
          path: ${{ runner.temp }}/bundle-functions

      # App Hosting builds the site again from the source this job uploads, so this scan looks at a build of the same
      # commit, lockfile and settings, not at the very files that run. It fails on any match, and when the patterns are
      # missing (see scripts/scan-bundle.mjs). The patterns are a secret, so they aren't in the repo. One step scans every
      # bundle this run deploys, so the secret is in one step only.
      - name: Scan the bundles for strings that must not ship
        env:
          BUNDLE_DENY_PATTERNS: ${{ secrets.BUNDLE_DENY_PATTERNS }}
        run: |
          dirs=()
          if [ "$DEPLOY_MAINNET" = true ]; then dirs+=("$RUNNER_TEMP/bundle-mainnet/static" "$RUNNER_TEMP/bundle-mainnet/server"); fi
          if [ "$DEPLOY_TESTNET" = true ]; then dirs+=("$RUNNER_TEMP/bundle-testnet/static" "$RUNNER_TEMP/bundle-testnet/server"); fi
          if [ "$DEPLOY_FUNCTIONS" = true ]; then dirs+=("$RUNNER_TEMP/bundle-functions"); fi
          if [ "${#dirs[@]}" -gt 0 ]; then node scripts/scan-bundle.mjs "${dirs[@]}"; fi

      # The scanned files go where firebase.json's functions source is, beside the package.json, lockfile and .npmrc of
      # this job's own checkout. A copy, no code run; App Hosting's uploads leave both files out (firebase.json).
      - name: Put the functions bundle in place
        if: env.DEPLOY_FUNCTIONS == 'true'
        run: cp "$RUNNER_TEMP/bundle-functions/index.js" "$RUNNER_TEMP/bundle-functions/functions.yaml" functions/deploy/

      # The Firebase CLI runs with the deploy credential, so its whole dependency tree is locked, not only its version:
      # tools/firebase holds the exact version and a lockfile with an integrity hash for every package. (npx would
      # resolve the tree afresh on every run.) Install scripts are off, so nothing from the tree runs until the CLI
      # does. To bump it: change that folder, read the release notes, run the dry run before the next real deploy.
      - name: Install the Firebase CLI from its lockfile
        run: npm ci --ignore-scripts --prefix tools/firebase

      # Nothing uses the access token asked for here: the Firebase CLI reads the credentials file this step leaves.
      # Asking makes this step prove the whole sign-in, acting as the service account included, and name the stage
      # that fails, where the CLI would only say "Failed to authenticate". The token is masked and lives five minutes.
      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token
          access_token_lifetime: 300s

      # The sign-in leaves a credentials file in the workspace, and the deploy uploads the workspace as source. The CLI
      # leaves out what .gitignore lists, so fail here if that ever stops covering the file.
      - name: The credentials file must be git-ignored
        run: git check-ignore --quiet -- "$GOOGLE_GHA_CREDS_PATH"

      # Two reads, nothing written. They prove the sign-in and the deployer's Service Usage and App Hosting read rights;
      # the Storage rights are first used by the deploy itself. The table should list the backends `arcos` and
      # `arcos-testnet`, with no repository (they deploy from source).
      - name: Dry run, list the App Hosting backends
        if: ${{ inputs.dry_run }}
        run: tools/firebase/node_modules/.bin/firebase apphosting:backends:list --project "$FIREBASE_PROJECT" --non-interactive

      # No --force: with it, a backend that can't be found is skipped and the CLI still reports success. Without it, and
      # non-interactive, the CLI stops with an error there instead of creating one.
      - name: Deploy the mainnet site to App Hosting
        id: deploy-mainnet
        if: ${{ !inputs.dry_run && env.DEPLOY_MAINNET == 'true' }}
        timeout-minutes: 40
        run: tools/firebase/node_modules/.bin/firebase deploy --only "apphosting:${APPHOSTING_BACKEND}" --project "$FIREBASE_PROJECT" --non-interactive

      # App Hosting picks a backend's settings by its environment name. Without `testnet`, arcos-testnet would be built
      # from apphosting.yaml alone: a copy of 4rc.OS, its fee recipient included. So the testnet deploy reads it first
      # (nothing written), after the mainnet deploy, so this check can only ever stop the testnet one.
      - name: The testnet backend's environment name must be testnet
        if: ${{ !inputs.dry_run && env.DEPLOY_TESTNET == 'true' }}
        run: |
          name="$(tools/firebase/node_modules/.bin/firebase apphosting:backends:get "$APPHOSTING_TESTNET_BACKEND" --project "$FIREBASE_PROJECT" --non-interactive --json | jq -r '.result.environment // ""')"
          if [ "$name" != testnet ]; then echo "::error::$APPHOSTING_TESTNET_BACKEND has the environment name '$name', not 'testnet' (docs/DEPLOYING.md, The testnet site)"; exit 1; fi

      # After the mainnet deploy, and only once it has succeeded (or wasn't asked for): a step after a failed one doesn't
      # run. Its own upload of the same source, built by App Hosting with apps/web/apphosting.testnet.yaml merged in.
      - name: Deploy the testnet site to App Hosting
        id: deploy-testnet
        if: ${{ !inputs.dry_run && env.DEPLOY_TESTNET == 'true' }}
        timeout-minutes: 40
        run: tools/firebase/node_modules/.bin/firebase deploy --only "apphosting:${APPHOSTING_TESTNET_BACKEND}" --project "$FIREBASE_PROJECT" --non-interactive

      # The composite indexes and field overrides of firestore/arcos.indexes.json, for the arcos database only (the only
      # one firebase.json lists). Without the force flag an index the file no longer names is left in place, never deleted. The
      # rules are not deployed here: the owner deploys firestore/arcos.rules by hand, and the deployer has no rules role.
      - name: Deploy the Firestore indexes
        id: deploy-indexes
        if: ${{ !inputs.dry_run && env.DEPLOY_INDEXES == 'true' }}
        timeout-minutes: 15
        run: tools/firebase/node_modules/.bin/firebase deploy --only firestore:indexes --project "$FIREBASE_PROJECT" --non-interactive

      # The functions codebase arcos, from functions/deploy: the CLI reads functions.yaml, uploads the folder, and Cloud
      # Build installs the two external packages from its lockfile with install scripts off. Only this codebase: a
      # function of another codebase is never touched.
      - name: Deploy the functions
        id: deploy-functions
        if: ${{ !inputs.dry_run && env.DEPLOY_FUNCTIONS == 'true' }}
        timeout-minutes: 30
        run: tools/firebase/node_modules/.bin/firebase deploy --only functions:arcos --project "$FIREBASE_PROJECT" --non-interactive

  # No credentials here: it only reads the public site. It checks 4rc.OS whenever its deploy succeeded, the testnet deploy
  # after it included or not; a run that deployed only the testnet site skips it (scripts/smoke.mjs reads mainnet).
  smoke:
    name: Smoke checks
    needs: deploy
    if: ${{ !cancelled() && !inputs.dry_run && needs.deploy.outputs.mainnet == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: node scripts/smoke.mjs
