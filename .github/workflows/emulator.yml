name: Emulator

on:
  push:
    branches: [main]
  pull_request:

# Read-only, no deploy step, no secrets. It checks out the repo, installs from the committed lockfiles and runs the
# @arcos/data Firestore emulator suite (its unit tests run in ci.yml). The suite talks only to the local emulator under
# the demo-arcos project id, so it needs no credential and none is available to it.
permissions:
  contents: read

jobs:
  firestore-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Same Node as ci.yml: the newest 22.x, from .nvmrc.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # firebase-tools 15 needs Java 21 or newer to run the Firestore emulator.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # The version ci.yml installs, so `npm ci` reads the lockfile the way it was written.
      - run: npm install -g npm@11.19.1

      - run: npm ci

      # The Firebase CLI at the version tools/firebase pins, from its own lockfile: the same CLI the deploys run. No
      # install scripts: the CLI downloads the Firestore emulator's jar itself when the suite first starts it.
      - run: npm ci --ignore-scripts --prefix tools/firebase

      # firebase emulators:exec starts the Firestore emulator, runs the suite against it and stops the emulator.
      - name: Emulator suite
        run: npm run test:emulator -w @arcos/data
