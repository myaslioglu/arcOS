[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../../node_modules"]
allow_paths = ["../../node_modules"]
remappings = [
  "@openzeppelin/contracts/=../../node_modules/@openzeppelin/contracts/",
  "forge-std/=../../node_modules/forge-std/src/",
]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"

[fuzz]
runs = 512

[fmt]
line_length = 120

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
arc = "https://rpc.mainnet.arc.io"
