[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../../node_modules"]
allow_paths = ["../../node_modules"]
remappings = [
  "@openzeppelin/contracts/=../../node_modules/@openzeppelin/contracts/",
  "forge-std/=../../node_modules/forge-std/src/",
]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"
# test/TokenFactoryNames.t.sol reads the name vectors it shares with the Mint form's tests.
fs_permissions = [{ access = "read", path = "./test/vectors" }]

[fuzz]
runs = 512

# The vault invariant suite (test/vault/VaultInvariants.t.sol). Each invariant function is its own campaign, so
# these numbers are multiplied by the number of invariants (seven): 1000 runs of 64 calls is 448,000 handler calls
# and takes about 80 seconds on four cores. Depth stays low because every run starts from nothing and a lock's whole
# life fits in a few dozen calls, while more runs means more different starting sequences. `fail_on_revert` is on:
# the handler catches every call into the contracts under test and predicts its outcome, so a revert here can only
# be a bug in the handler itself.
[invariant]
runs = 1000
depth = 64
fail_on_revert = true

[fmt]
line_length = 120

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
arc = "https://rpc.mainnet.arc.io"
