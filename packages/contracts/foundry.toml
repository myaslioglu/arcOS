[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../../node_modules"]
allow_paths = ["../../node_modules"]
remappings = [
  "@openzeppelin/contracts/=../../node_modules/@openzeppelin/contracts/",
  "forge-std/=../../node_modules/forge-std/src/",
]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"
# test/TokenFactoryNames.t.sol reads the name vectors it shares with the Mint form's tests.
fs_permissions = [{ access = "read", path = "./test/vectors" }]
# The fork suite needs the network, so the default run (and CI) leaves it out; the `fork` profile runs it alone.
no_match_path = "test/fork/**"

[fuzz]
runs = 512

# The default for an invariant suite that sets nothing of its own. Each suite sets its runs and depth inline, next to
# its contract (`/// forge-config: default.invariant.runs = ...`), because each invariant function is its own campaign
# and the right numbers depend on how many invariants a suite has and how costly its handler's calls are:
#   test/vault/VaultInvariants.t.sol     1000 runs x 64 calls (7 invariants)
#   test/vault/PositionInvariants.t.sol  1000 runs x 64 calls (6 invariants)
# `fail_on_revert` is on: each handler catches every call into the contracts under test and predicts its outcome, so a
# revert here can only be a bug in the handler itself.
[invariant]
runs = 128
depth = 64
fail_on_revert = true

[fmt]
line_length = 120

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
arc = "https://rpc.mainnet.arc.io"

# The fork suite, against the real Uniswap managers on a fork of Arc mainnet at a pinned block:
#   npm run test:fork   (FOUNDRY_PROFILE=fork node scripts/forge.mjs test -vv)
# A profile inherits the default's settings, and an empty `no_match_path` keeps the default's, so it names a path that
# does not exist instead. Its own build folders keep its partial build from hiding the default's artifacts: sharing
# them, a filtered default run straight after a fork run finds no tests.
[profile.fork]
match_path = "test/fork/**"
no_match_path = "none"
out = "out/fork"
cache_path = "cache/fork"
