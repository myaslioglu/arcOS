# Firebase App Hosting settings for the public site on Arc mainnet, https://4rcos.com (the backend's own
# address is https://arcos--arcos-c80cf.europe-west4.hosted.app). Public values only: nothing here is a secret.
# NEXT_PUBLIC_FEE_RECIPIENT is the project's own fee wallet (also the mainnet FeeController's owner and recipient);
# with it set, Swap and Bridge add the platform fee (SWAP_FEE_BPS in src/lib/appkit.ts), shown before confirming.
# NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID is the Reown project ID that lets phones connect a wallet through
# WalletConnect. It is a public client identifier that ships in the browser bundle, not a secret; the domain
# allowlist in the Reown dashboard is what limits its use. Without it the site offers browser wallets only.
# BLOCKSCOUT_API_KEY is a Secret Manager secret (never a NEXT_PUBLIC_ value): the server-built Inspector pages read
# explorer data through Blockscout's PRO API with it, because explorer.arc.io refuses server requests. Pinned to a
# version so a stray new value can't change what the site uses.

runConfig:
  minInstances: 0
  maxInstances: 2
  memoryMiB: 1024

env:
  - variable: NEXT_PUBLIC_ARC_NETWORK
    value: mainnet
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FEE_RECIPIENT
    value: "0x463A81a017326E9029DcCA2a2d9AA42599Bef12c"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://4rcos.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID
    value: "51f278b6746e0617a482ba5d0565689f"
    availability:
      - BUILD
      - RUNTIME
  - variable: BLOCKSCOUT_API_KEY
    secret: BLOCKSCOUT_API_KEY@1
    availability:
      - RUNTIME
  # ARCOS_SESSION_SECRET is a Secret Manager secret: the key of the sign-in cookie (lib/session.ts), 32 random bytes or
  # more, runtime only and pinned to a version. It has to exist, with access granted to this backend, before a rollout
  # of this file. Rotating it (a new version, pinned here) signs everyone out. Without it the site still runs and
  # sign-in answers 503.
  - variable: ARCOS_SESSION_SECRET
    secret: ARCOS_SESSION_SECRET@1
    availability:
      - RUNTIME
  # ARCOS_TRUSTED_HOPS is deliberately unset. It is a server-only setting for the rate limits (lib/rate-limit.ts): how many
  # entries, counted from the right of X-Forwarded-For, belong to the site's own proxies. Unset it is 0, and each client is
  # keyed by the rightmost entry, the one the nearest proxy added. If a Google load balancer in front of App Hosting adds
  # an entry of its own to the right of the client's, every visitor is keyed by that one entry and shares a single bucket:
  # stricter, never looser. To find out, measure. From one network, send requests to
  # /api/inspect/0x0000000000000000000000000000000000000001 until the limit answers 429 (30 a minute for each client, and per
  # server instance, so a run that reaches both instances may need up to 60). Within that minute, send a few from a second
  # network, such as a phone on mobile data.
  #   - A normal answer (here 404, "No contract at that address.") means visitors have buckets of their own: leave it unset.
  #   - A 429 means the two networks share a bucket: set it to 1 (uncomment the entry below) and measure again.
  # The value is safe only if every address the backend answers on reaches the app through the same number of proxies:
  # https://4rcos.com and the default address, https://arcos--arcos-c80cf.europe-west4.hosted.app. One number can't be right
  # for two paths. Measure both, and if they differ leave it unset.
  # Never set it higher than the measurement shows. A value above the real number of the site's own proxies makes the key
  # an entry the client wrote as soon as the client adds entries of its own to X-Forwarded-For, and it can then choose its
  # own bucket on every request.
  # - variable: ARCOS_TRUSTED_HOPS
  #   value: "1"
  #   availability:
  #     - RUNTIME
